<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}面试时间调整系统{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="{{ url_for('index') }}">面试时间调整系统</a>
      <nav>
        <a href="{{ url_for('verify_identity') }}">申请调整</a>
        {% if session.get('admin_id') %}
          <a href="{{ url_for('admin_dashboard') }}">管理后台</a>
          <form class="inline" method="post" action="{{ url_for('admin_logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="link-button" type="submit">退出（{{ session['admin_username'] }}）</button>
          </form>
        {% else %}
          <a href="{{ url_for('admin_login') }}">管理员登录</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
